[package]
name = "dispatch-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Derive a dispatch table from a struct's fields, its doc comments, and one macro you own."
authors = ["cstef <hi@cstef.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cestef/baudelaire"
keywords = ["derive", "macro", "config", "dispatch", "table"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = [
  "derive",
  "parsing",
  "printing",
  "proc-macro",
  "full",
  "clone-impls",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

too_long_first_doc_paragraph = "warn"
doc_markdown = "allow"

missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
