[package]
name = "baudelaire"
version = "0.0.6"
edition = "2024"
rust-version = "1.95"
description = "A Typst-native static site generator: write pages in Typst, get incremental builds, live reload, feeds, search, taxonomies, and an asset pipeline."
authors = ["cstef <root@cstef.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cestef/baudelaire"
homepage = "https://baudelaire.cstef.dev"
documentation = "https://baudelaire.cstef.dev"
readme = "README.md"
keywords = ["typst", "static-site", "ssg", "website", "cli"]
categories = ["command-line-utilities", "web-programming"]
exclude = [
    "/docs",
    "/.github",
    "/public",
    "/.jj",
    "/.claude",
    "/install.sh",
    "/tests",
    "/benches",
]

# Prebuilt-binary install via `cargo binstall baudelaire`, mapping each release
# target to its GitHub release tarball. Falls back to a source build otherwise.
[package.metadata.binstall]
# The default never matched a real asset: `{ target-family }` renders `unix`,
# and the `v` prefix was missing, so every target fell through to a source
# build. Each shipped target is spelled out instead.
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-{ arch }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "baudelaire"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-x86_64-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-aarch64-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-macos-aarch64.tar.gz"

[features]
default = ["embedded-fonts", "js", "css", "images", "cards"]

# Bundle Typst's default font set (Libertinus, New Computer Modern, DejaVu) into
# the binary: ~9 MiB. Off means text renders only with fonts found on the host,
# so keep it on for portable builds (CI, containers) that lack those fonts.
embedded-fonts = ["typst-kit/embedded-fonts"]

# JavaScript bundling via rolldown (import resolution, tree-shaking, minify, and
# the `baudelaire:*` virtual modules): ~2.5 MiB of oxc/rolldown/tokio. Off means
# `.js` files are copied verbatim by the asset pipeline instead of bundled.
js = ["dep:rolldown", "dep:rolldown_common"]

# CSS minification and `url()`/`@import` fingerprint rewriting via lightningcss:
# ~3.2 MiB. Off means `.css` files are copied verbatim (no minify, no rewrite).
css = ["dep:lightningcss"]

# Raster optimization: lossless PNG recompression (oxipng) and JPEG re-encode with
# EXIF-orientation baking (image). Off means PNG/JPEG assets are copied verbatim.
# Note: `<img>` lazy/async annotation is attribute-only and stays on regardless.
images = ["dep:oxipng", "dep:image"]

# Social card rendering: compiles `templates/card.typ` to a paged document and
# rasterizes it to PNG (typst-render, ~1 MiB of tiny-skia). Off means an
# `output { cards { } }` block warns and produces nothing.
cards = ["dep:typst-render", "dep:typst-layout"]

# Build OpenSSL from source and link it statically instead of using the host's
# libssl. Both the Typst package downloader (`typst-kit`) and our HTTP client
# (`ureq`) pull in `native-tls` and thus OpenSSL, which has no system copy on a static
# musl target, so the musl release builds turn this on. Needs a C compiler,
# `perl`, and `make` at build time.
vendored-openssl = ["typst-kit/vendor-openssl", "ureq/vendored"]

[dependencies]
typst = { version = "0.15" }
typst-html = { version = "0.15" }
typst-svg = { version = "0.15" }
typst-render = { version = "0.15", optional = true }
# `PagedDocument` lives here and `typst` does not re-export it, so naming the
# card's compile target needs the layout crate directly.
typst-layout = { version = "0.15", optional = true }
typst-kit = { version = "0.15", features = [
  "system-files",
  "system-downloader",
  "scan-fonts",
] }
typst-eval = "0.15"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
itertools = "0.15.0"
kdl = { version = "6" }
serde = { version = "1", features = ["derive"] }
# Slugs normalize to NFC first: a macOS filename arrives decomposed, and a
# combining mark is not a letter, so `café` would otherwise slug to `cafe`
# depending only on which normalization form the author's OS produced.
unicode-normalization = "0.1"
serde_json = "1"
blake3 = "1"
parking_lot = "0.12"
flume = "0.12"
quick-xml = "0.41"
wax = "0.7"
anstream = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
rayon = "1"
notify = "8"
notify-debouncer-full = "0.7"
tiny_http = "0.12"
open = "5"
lightningcss = { version = "1.0.0-alpha.71", optional = true }
rolldown = { version = "1", optional = true }
tokio = { version = "1.52.3", features = [
  "rt",
  "rt-multi-thread",
  "net",
  "time",
  "io-util",
] }
russh = "0.62.2"
russh-sftp = "2.3.0"
rolldown_common = { version = "1", optional = true }
oxipng = { version = "10.1.1", default-features = false, features = [
  "parallel",
], optional = true }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
], optional = true }
console = "0.16"
ureq = { version = "3", default-features = false, features = [
  "json",
  "native-tls",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
sha2 = "0.11.0"
hmac = "0.13.0"
roxmltree = "0.21.1"
md-5 = "0.11.0"
include_dir = "0.7.4"

[dev-dependencies]
tempfile = "3"
# Generate test images (already in the tree via the `images` feature).
image = { version = "0.25", default-features = false, features = ["png"] }
# The scenario harness (`tests/scenarios.rs`) reads its cases as KDL, the same
# language the product's own config speaks. A normal dependency is out of reach
# from an integration test, so it is repeated here.
kdl = { version = "6" }
# ...and asserts on `Diagnostic::code`, which needs the trait in scope.
miette = { version = "7" }
criterion = { version = "0.8", features = ["html_reports"] }
# In-process SSH/SFTP server for the deploy end-to-end test.
russh = "0.62.2"
russh-sftp = "2.3.0"
rand = "0.10"
tokio = { version = "1.52.3", features = ["rt", "net", "io-util"] }

[[bench]]
name = "text"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "content"
harness = false

[[bench]]
name = "build"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Size-optimized release. `opt-level = "s"` + thin LTO + a single codegen unit
# lets the linker drop dead code across the ~500-crate tree; `strip` removes
# ~15 MiB of symbol/debug tables and `panic = "abort"` another ~4 MiB of unwind
# tables. Cargo force-unwinds the test/bench profiles, so `cargo bench` (criterion
# needs unwinding) keeps working without an override here.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
