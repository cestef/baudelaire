[workspace]
members = ["macros"]

[package]
name = "baudelaire"
version = "0.0.16"
edition = "2024"
rust-version = "1.95"
description = "A Typst-native static site generator: write pages in Typst, get incremental builds, live reload, feeds, search, taxonomies, and an asset pipeline."
authors = ["cstef <hi@cstef.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cestef/baudelaire"
homepage = "https://baudelaire.cstef.dev"
documentation = "https://baudelaire.cstef.dev"
readme = "README.md"
keywords = ["typst", "static-site", "ssg", "website", "cli"]
categories = ["command-line-utilities", "web-programming"]
exclude = [
  "/macros",
  "/docs",
  "/themes/demo",
  "/.github",
  "/public",
  "/.jj",
  "/.claude",
  "/install.sh",
  "/tests",
  "/benches",
  "/cliff.toml",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-{ arch }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "baudelaire"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-x86_64-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-linux-aarch64-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-macos-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-macos-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/baudelaire-windows-x86_64.zip"
pkg-fmt = "zip"
bin-dir = "baudelaire.exe"

[features]
default = [
  "embedded-fonts",
  "js",
  "css",
  "sass",
  "tailwind",
  "images",
  "cards",
  "pdf",
  "epub",
  "ssh",
  "announce",
  "themes",
  "markdown",
]

# Bundle Typst's default font set into the binary: ~9 MiB
embedded-fonts = ["typst-kit/embedded-fonts"]

# The `theme` command
themes = ["dep:flate2", "dep:tar", "dep:zip"]

# JavaScript bundling via rolldown
js = ["dep:rolldown", "dep:rolldown_common", "dep:tokio"]

# CSS minification and `url()` + `@import` fingerprint rewriting via lightningcss
css = ["dep:lightningcss", "dep:parcel_sourcemap"]

# Sass compilation via grass
sass = ["dep:grass", "css"]

# TailwindCSS support via encre-css
tailwind = ["dep:encre-css"]

# Raster optimization
images = ["dep:oxipng", "dep:image"]

sidecars = ["dep:typst-layout"]

# Social card rendering
cards = ["dep:typst-render", "sidecars"]

# PDF sidecar generation
pdf = ["dep:typst-pdf", "sidecars"]

# EPUB 3 bundles
epub = ["dep:zip"]

# SSH/SFTP deploy backend via russh
ssh = ["dep:russh", "dep:russh-sftp", "dep:tokio"]

# Announcing to an AT Protocol PDS (standard.site)
announce = []

# `.md` content pages, lowered to Typst source before they compile
markdown = ["dep:pulldown-cmark", "dep:typst-library", "dep:typst-utils"]

# Build OpenSSL from source and link it statically instead of the host's libssl
vendored-openssl = ["typst-kit/vendor-openssl", "ureq/vendored"]

[dependencies]
dispatch-derive = { version = "0.1.0", path = "macros" }
typst = { version = "0.15" }
typst-html = { version = "0.15" }
typst-svg = { version = "0.15" }
typst-pdf = { version = "0.15", optional = true }
typst-render = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-kit = { version = "0.15", features = [
  "system-files",
  "system-downloader",
  "scan-fonts",
] }
typst-eval = "0.15"
typst-library = { version = "0.15", optional = true }
typst-utils = { version = "0.15", optional = true }
syntect = { version = "5.3", default-features = false, features = [
  "parsing",
  "regex-fancy",
  "yaml-load",
] }
comemo = "0.5"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
# `string`: the config keys a `config` verb completes are read out of the
# dispatch tables at runtime, so its possible values are owned strings.
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
clap_complete_nushell = "4"
clap_mangen = "0.2"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
itertools = "0.15.0"
kdl = { version = "6" }
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
serde_json = "1"
blake3 = "1"
parking_lot = "0.12"
flume = "0.12"
quick-xml = "0.41"
wax = "0.7"
# Linear-time by construction, so a pattern a site declares cannot be made to
# backtrack: `check { snippets }` reaches a backtracking engine through syntect,
# and a frontmatter schema must not.
regex = "1"
anstream = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
rayon = "1"
notify = "8"
notify-debouncer-full = "0.7"
tiny_http = "0.12"
open = "5"
lightningcss = { version = "1.0.0-alpha.71", default-features = false, features = [
  "sourcemap",
], optional = true }
parcel_sourcemap = { version = "2.1.1", features = ["json"], optional = true }
grass = { version = "0.13.4", default-features = false, features = [
  "random",
], optional = true }
encre-css = { version = "0.20.1", optional = true }
rolldown = { version = "1", optional = true }
tokio = { version = "1.52.3", features = [
  "rt",
  "rt-multi-thread",
  "net",
  "time",
  "io-util",
], optional = true }
russh = { version = "0.62.2", default-features = false, features = [
  "ring",
  "rsa",
  "flate2",
], optional = true }
russh-sftp = { version = "2.3.0", optional = true }
rolldown_common = { version = "1", optional = true }
oxipng = { version = "10.1.1", default-features = false, features = [
  "parallel",
], optional = true }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
], optional = true }
console = "0.16"
ureq = { version = "3", default-features = false, features = [
  "json",
  "native-tls",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
sha2 = "0.11.0"
hmac = "0.13.0"
roxmltree = "0.21.1"
md-5 = "0.11.0"
include_dir = "0.7.4"
flate2 = { version = "1.1.9", optional = true }
tar = { version = "0.4.46", optional = true }
zip = { version = "8.6.0", default-features = false, features = [
  "deflate",
], optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
# Read by the markdown frontmatter dialects and by the snippet lint, which is
# in every flavor: a `toml` or `yaml` fence is checked whether or not this build
# can publish a `.md` page.
toml_edit = { version = "0.22", default-features = false, features = ["parse"] }
saphyr = { version = "0.0.11", default-features = false }
# The event stream behind `saphyr`, which the loaded document cannot stand in
# for: a repeated key is already gone by the time there is a mapping to inspect.
saphyr-parser = { version = "0.0.11", default-features = false }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
kdl = { version = "6" }
miette = { version = "7" }
regex = { version = "1" }
serde_json = { version = "1" }
criterion = { version = "0.8", features = ["html_reports"] }
russh = { version = "0.62.2", default-features = false, features = [
  "ring",
  "rsa",
  "flate2",
] }
russh-sftp = "2.3.0"
rand = "0.10"
tokio = { version = "1.52.3", features = ["rt", "net", "io-util"] }
tiny_http = "0.12"

[[bench]]
name = "text"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "content"
harness = false

[[bench]]
name = "build"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
str_to_string = "warn"
clone_on_ref_ptr = "warn"
verbose_file_reads = "warn"
unnecessary_self_imports = "warn"
empty_enum_variants_with_brackets = "warn"
infinite_loop = "warn"
mem_forget = "warn"
rc_buffer = "warn"
float_cmp_const = "warn"

must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

too_long_first_doc_paragraph = "warn"
doc_markdown = "allow"

missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
future_not_send = "allow"
redundant_pub_crate = "allow"

struct_excessive_bools = "allow"

literal_string_with_formatting_args = "allow"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
