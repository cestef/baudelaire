[package]
name = "baudelaire"
version = "0.1.0"
edition = "2024"

[dependencies]
typst = { version = "0.15" }
typst-html = { version = "0.15" }
typst-library = { version = "0.15" }
typst-kit = { version = "0.15", features = [
  "system-files",
  "system-downloader",
  "scan-fonts",
  "embedded-fonts",
] }
typst-eval = "0.15"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
itertools = "0.15.0"
kdl = { version = "6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
parking_lot = "0.12"
flume = "0.12"
quick-xml = "0.41"
wax = "0.7"
anstream = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
rayon = "1"
notify = "8"
notify-debouncer-full = "0.7"
tiny_http = "0.12"
open = "5"
lightningcss = "1.0.0-alpha.71"
rolldown = "1"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread"] }
rolldown_common = "1"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
console = "0.16"
ureq = { version = "3", features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
indicatif = { version = "0.18.6", features = ["rayon"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "text"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "content"
harness = false

[[bench]]
name = "build"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
