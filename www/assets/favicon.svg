<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root { --wine: #8a2846; --paper: #fdfcfa; }
    @media (prefers-color-scheme: dark) {
      :root { --wine: #e58fa6; --paper: #16140f; }
    }
  </style>
  <rect width="32" height="32" rx="7" fill="var(--wine)"/>
  <text x="16" y="23" text-anchor="middle" fill="var(--paper)"
        font-family="Georgia, 'Times New Roman', serif" font-size="21"
        font-style="italic" font-weight="600">B</text>
</svg>
