name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"

      - name: tag matches Cargo.toml
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(cargo metadata --format-version 1 --no-deps \
            | sed -n 's/.*"name":"baudelaire","version":"\([^"]*\)".*/\1/p')
          [ "$tag" = "v$version" ] || {
            echo "tag $tag does not match Cargo.toml version $version"
            exit 1
          }

      # The changelog is written by hand, so nothing else can notice it was
      # forgotten. A release with no entry is a release nobody can read.
      - name: changelog has a section for the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          grep -q "^## \[${tag#v}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${tag#v}]' section"
            echo "run \`just changelog\`, then write it"
            exit 1
          }

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (slim)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: test
        uses: cestef/actions/nextest@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          run: "true"
          args: --workspace --no-tests warn

  build:
    name: build ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-aarch64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            macos: true
          # Cross-compiled from the Apple Silicon runner rather than run on an
          # Intel one: the toolchain ships both slices, and it avoids depending
          # on which Intel runner label GitHub currently offers. Nothing here
          # runs the resulting binary, so a cross build costs no coverage.
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            macos: true
          # The one target that is neither tar nor ELF: it packages a `.zip`
          # around a `.exe`, which is what `windows: true` selects below.
          # `install.sh` is POSIX and does not cover it; `install.ps1` is its
          # counterpart, shipped beside it and serving this archive.
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            windows: true
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          targets: ${{ matrix.target }}
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: ${{ !matrix.macos && !matrix.windows }}
        with:
          rustflags: "false"

      # mold is a Linux linker, so both non-Linux targets fall back to the
      # platform's own. `shell: bash` is what makes this one line work on the
      # Windows runner too, where the default shell is PowerShell and `>>` to
      # `$GITHUB_ENV` would not mean this.
      - name: system linker
        if: ${{ matrix.macos || matrix.windows }}
        shell: bash
        run: echo "RUSTFLAGS=" >> "$GITHUB_ENV"

      - name: musl toolchain
        uses: cestef/actions/musl@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: matrix.musl

      - name: restore cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b

      - name: build
        shell: bash
        env:
          EXTRA_FEATURES: ${{ matrix.musl && 'vendored-openssl' || '' }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          # What the binary is called and what goes around it. Windows is the
          # only target that differs on either, and naming both here keeps
          # `package` free of per-platform branching beyond the archive step.
          BIN: ${{ matrix.windows && 'baudelaire.exe' || 'baudelaire' }}
          ARCHIVE: ${{ matrix.windows && 'zip' || 'tar.gz' }}
        run: |
          set -euo pipefail
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"
            else shasum -a 256 "$1"; fi
          }
          package() {
            local suffix="$1"; shift
            cargo build --release --target ${{ matrix.target }} \
              ${EXTRA_FEATURES:+--features "$EXTRA_FEATURES"} "$@"
            local out="baudelaire-${{ matrix.name }}${suffix}.${ARCHIVE}"
            local dir="target/${{ matrix.target }}/release"
            # Both archives hold the bare binary at the root, so extracting
            # either leaves one file next to you and the install line in the
            # release notes is the same shape on every platform.
            #
            # `root` is captured before the subshell rather than read back as
            # `$OLDPWD`: 7z writes to a path relative to where it runs.
            local root; root=$(pwd)
            case "$ARCHIVE" in
              zip) ( cd "$dir" && 7z a -bso0 "$root/$out" "$BIN" ) ;;
              *)   tar -C "$dir" -czf "$out" "$BIN" ;;
            esac
            checksum "$out" > "$out.sha256"
            ls -la "$out" "$out.sha256"
          }
          package ""
          package "-slim" --no-default-features

      # Globbed rather than listed: the four names differ by platform now
      # (`.tar.gz` against `.zip`), and a wildcard that covers both beats
      # duplicating the matrix's own branching here.
      - name: upload archives
        uses: actions/upload-artifact@v7
        with:
          name: baudelaire-${{ matrix.name }}
          path: baudelaire-${{ matrix.name }}*

      - name: save cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: always()
        with:
          mode: save

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download tarballs
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: flatten artifacts
        run: |
          mkdir -p release
          find dist -mindepth 2 -type f -exec mv -t release {} +
          for script in install.sh install.ps1; do
            cp "$script" release/
            ( cd release && sha256sum "$script" > "$script.sha256" )
          done
          ls -la release

      - name: release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag || github.ref_name }}"
          # The size of the binary *inside* the archive, not of the archive, so
          # the table says what lands on disk. Reads either container: the
          # Windows rows are `.zip`, every other row is `.tar.gz`.
          bin_size() {
            local archive="release/$1"
            [ -f "$archive" ] || { echo "?"; return; }
            local bytes
            case "$archive" in
              *.zip) bytes=$(unzip -l "$archive" 2>/dev/null \
                       | awk '/baudelaire\.exe$/ {print $1; exit}') ;;
              *)     bytes=$(tar -tzvf "$archive" 2>/dev/null \
                       | awk '/[[:space:]]baudelaire$/ {print $3; exit}') ;;
            esac
            [ -n "$bytes" ] || { echo "?"; return; }
            awk -v b="$bytes" 'BEGIN { printf "%.1f MB\n", b/1024/1024 }'
          }
          # One row per archive that was actually built, rather than a table
          # naming every target by hand: adding a row to the build matrix used
          # to mean remembering to add one here too, and forgetting was silent.
          ARTIFACTS=$(
            for path in release/*.tar.gz release/*.zip; do
              [ -f "$path" ] || continue
              file=${path#release/}
              # shellcheck disable=SC2016  # the backticks are markdown code
              # spans in the output, not command substitution
              printf '| `%s` | %s |\n' "${file%%.*}" "$(bin_size "$file")"
            done
          )

          # This version's CHANGELOG section, verbatim: its own heading to the
          # next one. `gate` has already refused the tag if there is no such
          # section, so coming back empty here means the file's shape moved,
          # which is worth failing on rather than publishing hollow notes.
          CHANGES=$(awk -v want="## [${VERSION#v}]" '
            index($0, want) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md)
          printf '%s' "$CHANGES" | grep -q '[^[:space:]]' || {
            echo "no CHANGELOG.md section found for ${VERSION#v}"
            exit 1
          }

          command -v envsubst >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          }
          # Named explicitly so only these three expand and the `$PATH` and
          # `${VERSION}`-shaped text in the prose survives. The leading HTML
          # comment documents the template for whoever edits it and is dropped
          # rather than published.
          export VERSION ARTIFACTS CHANGES
          # shellcheck disable=SC2016  # the shell-format list is envsubst's
          # argument, and expanding it here is exactly what it must not do
          sed '/^<!--/,/^-->/d' .github/release-notes.md \
            | envsubst '${VERSION} ${ARTIFACTS} ${CHANGES}' > release-notes.md
          cat release-notes.md

          {
            echo "size_full=$(bin_size baudelaire-linux-x86_64.tar.gz)"
            echo "size_slim=$(bin_size baudelaire-linux-x86_64-slim.tar.gz)"
            echo "version=${VERSION#v}"
          } >> "$GITHUB_OUTPUT"

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "$tag" --notes-file release-notes.md
          fi

      - name: badge (binary size)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: binary
          value: ${{ steps.notes.outputs.size_full }}
          color: "#58a6ff"
          file: binary-size.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: badge (binary size, slim)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: binary (slim)
          value: ${{ steps.notes.outputs.size_slim }}
          color: "#58a6ff"
          file: binary-size-slim.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: badge (crates.io)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: crates.io
          value: v${{ steps.notes.outputs.version }}
          color: "#e0902f"
          file: crates-io.svg
          token: ${{ secrets.GITHUB_TOKEN }}

  crates:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"

      - name: crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
