name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"

      - name: tag matches Cargo.toml
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(cargo metadata --format-version 1 --no-deps \
            | sed -n 's/.*"name":"baudelaire","version":"\([^"]*\)".*/\1/p')
          [ "$tag" = "v$version" ] || {
            echo "tag $tag does not match Cargo.toml version $version"
            exit 1
          }

      # The changelog is written by hand, so nothing else can notice it was
      # forgotten. A release with no entry is a release nobody can read.
      - name: changelog has a section for the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          grep -q "^## \[${tag#v}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${tag#v}]' section"
            echo "run \`just changelog\`, then write it"
            exit 1
          }

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (slim)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: test
        uses: cestef/actions/nextest@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          run: "true"
          args: --workspace --no-tests warn

  build:
    name: build ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-aarch64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            macos: true
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          targets: ${{ matrix.target }}
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: ${{ !matrix.macos }}
        with:
          rustflags: "false"

      - name: system linker
        if: matrix.macos
        run: echo "RUSTFLAGS=" >> "$GITHUB_ENV"

      - name: musl toolchain
        uses: cestef/actions/musl@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: matrix.musl

      - name: restore cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b

      - name: build
        shell: bash
        env:
          EXTRA_FEATURES: ${{ matrix.musl && 'vendored-openssl' || '' }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"
            else shasum -a 256 "$1"; fi
          }
          package() {
            local suffix="$1"; shift
            cargo build --release --target ${{ matrix.target }} \
              ${EXTRA_FEATURES:+--features "$EXTRA_FEATURES"} "$@"
            local out="baudelaire-${{ matrix.name }}${suffix}.tar.gz"
            tar -C "target/${{ matrix.target }}/release" -czf "$out" baudelaire
            checksum "$out" > "$out.sha256"
            ls -la "$out" "$out.sha256"
          }
          package ""
          package "-slim" --no-default-features

      - name: upload tarballs
        uses: actions/upload-artifact@v7
        with:
          name: baudelaire-${{ matrix.name }}
          path: |
            baudelaire-${{ matrix.name }}.tar.gz
            baudelaire-${{ matrix.name }}.tar.gz.sha256
            baudelaire-${{ matrix.name }}-slim.tar.gz
            baudelaire-${{ matrix.name }}-slim.tar.gz.sha256

      - name: save cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: always()
        with:
          mode: save

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download tarballs
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: flatten artifacts
        run: |
          mkdir -p release
          find dist -mindepth 2 -type f -exec mv -t release {} +
          cp install.sh release/
          ( cd release && sha256sum install.sh > install.sh.sha256 )
          ls -la release

      - name: release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag || github.ref_name }}"
          bin_size() {
            local tarball="release/$1"
            [ -f "$tarball" ] || { echo "?"; return; }
            local bytes
            bytes=$(tar -tzvf "$tarball" 2>/dev/null \
              | awk '/[[:space:]]baudelaire$/ {print $3; exit}')
            [ -n "$bytes" ] || { echo "?"; return; }
            awk -v b="$bytes" 'BEGIN { printf "%.1f MB\n", b/1024/1024 }'
          }
          SIZE_X86=$(bin_size "baudelaire-linux-x86_64.tar.gz")
          SIZE_ARM=$(bin_size "baudelaire-linux-aarch64.tar.gz")
          SIZE_X86_SLIM=$(bin_size "baudelaire-linux-x86_64-slim.tar.gz")
          SIZE_ARM_SLIM=$(bin_size "baudelaire-linux-aarch64-slim.tar.gz")
          SIZE_X86_MUSL=$(bin_size "baudelaire-linux-x86_64-musl.tar.gz")
          SIZE_ARM_MUSL=$(bin_size "baudelaire-linux-aarch64-musl.tar.gz")
          SIZE_X86_MUSL_SLIM=$(bin_size "baudelaire-linux-x86_64-musl-slim.tar.gz")
          SIZE_ARM_MUSL_SLIM=$(bin_size "baudelaire-linux-aarch64-musl-slim.tar.gz")
          SIZE_MAC_ARM=$(bin_size "baudelaire-macos-aarch64.tar.gz")
          SIZE_MAC_ARM_SLIM=$(bin_size "baudelaire-macos-aarch64-slim.tar.gz")

          cat > release-notes.md <<EOF
          ## Install

          Prebuilt binary (Linux x86_64/aarch64, macOS Apple Silicon),
          checksum-verified. Fetch the script, skim it, then run it:

          \`\`\`bash
          curl -fsSL https://baudelaire.cstef.dev/install.sh -o install.sh
          less install.sh          # read before you run
          sh install.sh            # PREFIX= to change dir, VERSION=${VERSION} to pin
          \`\`\`

          Want the smaller binary? \`FLAVOR=slim sh install.sh\`.

          Prefer Cargo? \`cargo binstall baudelaire\` pulls the full tarballs.

          Or install by hand from the tarballs below:

          \`\`\`bash
          tar -xzf baudelaire-linux-x86_64.tar.gz
          install -m 0755 baudelaire ~/.local/bin/
          \`\`\`

          ## Builds

          Two flavors per target. **full** is the default: everything built in.
          **slim** drops the bundled fonts and the CSS/JS/image pipelines, so it
          renders with system fonts only and copies \`.css\`/\`.js\`/images verbatim
          (no minify, bundle, or optimize). Pick slim when your host has the fonts
          and you run your own asset tooling.

          The \`gnu\` builds link the host's glibc; the fully static \`musl\` builds
          run anywhere (Alpine, distroless, scratch containers). The macOS build
          is unsigned and unnotarized, so the first run needs a right-click ->
          Open, or \`xattr -d com.apple.quarantine baudelaire\`. Intel Macs have
          no prebuilt binary: \`cargo install baudelaire\` builds one.

          | Artifact | Size |
          |----------|------|
          | \`baudelaire-linux-x86_64\` | ${SIZE_X86} |
          | \`baudelaire-linux-x86_64-slim\` | ${SIZE_X86_SLIM} |
          | \`baudelaire-linux-x86_64-musl\` | ${SIZE_X86_MUSL} |
          | \`baudelaire-linux-x86_64-musl-slim\` | ${SIZE_X86_MUSL_SLIM} |
          | \`baudelaire-linux-aarch64\` | ${SIZE_ARM} |
          | \`baudelaire-linux-aarch64-slim\` | ${SIZE_ARM_SLIM} |
          | \`baudelaire-linux-aarch64-musl\` | ${SIZE_ARM_MUSL} |
          | \`baudelaire-linux-aarch64-musl-slim\` | ${SIZE_ARM_MUSL_SLIM} |
          | \`baudelaire-macos-aarch64\` | ${SIZE_MAC_ARM} |
          | \`baudelaire-macos-aarch64-slim\` | ${SIZE_MAC_ARM_SLIM} |

          Every artifact ships a matching \`.sha256\` (the installer too). Verify:

          \`\`\`bash
          sha256sum -c baudelaire-linux-x86_64.tar.gz.sha256   # shasum -a 256 -c on macOS
          \`\`\`
          EOF
          cat release-notes.md

          {
            echo "size_full=${SIZE_X86}"
            echo "size_slim=${SIZE_X86_SLIM}"
            echo "version=${VERSION#v}"
          } >> "$GITHUB_OUTPUT"

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "$tag" --notes-file release-notes.md
          fi

      - name: badge (binary size)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: binary
          value: ${{ steps.notes.outputs.size_full }}
          color: "#58a6ff"
          file: binary-size.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: badge (binary size, slim)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: binary (slim)
          value: ${{ steps.notes.outputs.size_slim }}
          color: "#58a6ff"
          file: binary-size-slim.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: badge (crates.io)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: crates.io
          value: v${{ steps.notes.outputs.version }}
          color: "#e0902f"
          file: crates-io.svg
          token: ${{ secrets.GITHUB_TOKEN }}

  crates:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"

      - name: crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
