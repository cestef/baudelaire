name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"
      - name: restore cargo registry
        id: registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: restore build cache
        id: build-cache
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test prerequisites
        run: |
          for tool in curl base64 git; do
            command -v "$tool" >/dev/null || { echo "$tool is required"; exit 1; }
          done

      - name: test
        id: test
        uses: cestef/actions/nextest@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          run: "true"
          args: --workspace --no-tests warn

      - name: clippy (slim)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: test (slim)
        uses: cestef/actions/nextest@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          run: "true"
          args: --workspace --no-default-features --no-tests warn

      - name: memory diagnostics
        uses: cestef/actions/mem-diagnostics@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: failure()

      - name: facts
        id: facts
        run: |
          set -euo pipefail
          {
            echo "typst=$(grep -m1 'typst = {' Cargo.toml | sed -n 's/.*version = "\([^"]*\)".*/\1/p')"
            echo "msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          } >> "$GITHUB_OUTPUT"

      - name: badge (tests)
        if: always()
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: tests
          value: ${{ steps.test.outputs.passed }}/${{ steps.test.outputs.total }} passing
          percent: ${{ steps.test.outputs.percent }}
          thresholds: "100:#3fb950,0:#e5534b"
          file: tests.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: badge (typst)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: typst
          value: ${{ steps.facts.outputs.typst }}
          color: "#a371f7"
          file: typst.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: badge (msrv)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: rust
          value: ${{ steps.facts.outputs.msrv }}+
          color: "#8b949e"
          file: msrv.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: save cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: always() && steps.registry.outputs.hit != 'true'
        with:
          mode: save
      - name: save build cache
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: always() && steps.build-cache.outputs.hit != 'true'
        with:
          mode: save
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          components: llvm-tools-preview
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"
      - name: restore cargo registry
        id: registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b

      - name: coverage
        id: cov
        uses: cestef/actions/tarpaulin@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          args: --workspace --exclude-files benches/* --engine llvm
          out: Stdout Xml

      - name: coverage report
        uses: cestef/actions/coverage-report@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          file: cobertura.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          ratchet: "true"
          badge-label: coverage

      - name: upload coverage xml
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: cobertura.xml

