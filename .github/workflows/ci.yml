# First-party actions are pinned to a commit, not `@github`: the coverage job
# hands one a token with write access to this repo, so a push to the actions
# repo would otherwise change what runs with it. Bump with:
#   git ls-remote https://github.com/cestef/actions github
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Coverage is ~490s, far and away the slowest thing here, and its value on a
  # main push is only to refresh the baseline. Nightly does that just as well.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push makes the in-flight run for the same ref obsolete, so stop paying
# for it. Release is deliberately excluded: cancelling mid-publish is worse than
# a redundant run.
concurrency:
  # The event is part of the group so a push to main cannot cancel the nightly
  # coverage run, which shares the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # sccache used to set this. Incremental artifacts are worthless to a
  # fresh runner and would bloat the cached target/ tree.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: cestef/actions/rust@422d6bed78275189e5891cce0b83e6c0d6c05201
      - name: mold linker
        uses: cestef/actions/mold@422d6bed78275189e5891cce0b83e6c0d6c05201
        with:
          rustflags: "false" # RUSTFLAGS already carries the mold link-arg
      # Restore the crate registry, so a warm run downloads no crates.
      - name: restore cargo registry
        id: registry
        uses: cestef/actions/cargo-cache@422d6bed78275189e5891cce0b83e6c0d6c05201
      # Restore target/ (dep rlibs, build-script outputs, fingerprint DB).
      - name: restore build cache
        id: build-cache
        uses: cestef/actions/cargo-cache@422d6bed78275189e5891cce0b83e6c0d6c05201
        with:
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

      # Cheapest check first: rustfmt compiles nothing, so it fails fastest.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # End-to-end tests shell out to these; a missing one looks like a product
      # bug rather than a missing tool.
      - name: test prerequisites
        run: |
          for tool in curl base64 git; do
            command -v "$tool" >/dev/null || { echo "$tool is required"; exit 1; }
          done

      - name: test
        uses: cestef/actions/nextest@422d6bed78275189e5891cce0b83e6c0d6c05201
        with:
          run: "true"
          args: --workspace --no-tests warn

      # The `slim` flavour ships for every target but nothing else builds it, so
      # a feature-gated break stayed invisible until a tag was pushed.
      - name: clippy (slim)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: test (slim)
        uses: cestef/actions/nextest@422d6bed78275189e5891cce0b83e6c0d6c05201
        with:
          run: "true"
          args: --workspace --no-default-features --no-tests warn

      - name: memory diagnostics
        uses: cestef/actions/mem-diagnostics@422d6bed78275189e5891cce0b83e6c0d6c05201
        if: failure()

      # Only on a miss: the key is immutable, so saving over an exact hit is
      # gigabytes of tar for a reservation that is guaranteed to be refused.
      - name: save cargo registry
        uses: cestef/actions/cargo-cache@422d6bed78275189e5891cce0b83e6c0d6c05201
        if: always() && steps.registry.outputs.hit != 'true'
        with:
          mode: save
      - name: save build cache
        uses: cestef/actions/cargo-cache@422d6bed78275189e5891cce0b83e6c0d6c05201
        if: always() && steps.build-cache.outputs.hit != 'true'
        with:
          mode: save
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Everywhere but a push: pull requests need the ratchet, the nightly keeps
    # the baseline and badge current, and a push to main gets the fast lane.
    if: github.event_name != 'push'
    # `contents` to push the badge branch, `pull-requests` to comment.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # llvm-tools-preview: tarpaulin's LLVM engine reads profraw with llvm-profdata.
      - name: rust toolchain
        uses: cestef/actions/rust@422d6bed78275189e5891cce0b83e6c0d6c05201
        with:
          components: llvm-tools-preview
      - name: mold linker
        uses: cestef/actions/mold@422d6bed78275189e5891cce0b83e6c0d6c05201
        with:
          rustflags: "false" # RUSTFLAGS already carries the mold link-arg
      - name: restore cargo registry
        id: registry
        uses: cestef/actions/cargo-cache@422d6bed78275189e5891cce0b83e6c0d6c05201

      # No target/ cache here on purpose. The instrumented tree was 6.2 GB of a
      # 10 GB repo-wide budget, so it evicted the caches that do pay for
      # themselves, while tarpaulin re-instruments regardless: measured across
      # four runs it bought 75-186s of cache I/O for no reliable saving.
      #
      # cargo-llvm-cov was measured as the alternative and rejected: 905s cold
      # against tarpaulin's ~490s, and its 280s warm path needs a target dir far
      # past what GitHub will cache. `cestef/actions/llvm-cov` exists if that
      # ever changes.
      - name: coverage
        id: cov
        uses: cestef/actions/tarpaulin@422d6bed78275189e5891cce0b83e6c0d6c05201
        with:
          args: --workspace --exclude-files benches/* --engine llvm
          out: Stdout Xml

      # Publish the badge and baseline to the `badges` branch (default branch
      # only), comment the delta on PRs, and ratchet: a PR can't drop coverage
      # below main's, minus a small tolerance.
      - name: coverage report
        uses: cestef/actions/coverage-report@422d6bed78275189e5891cce0b83e6c0d6c05201
        with:
          file: cobertura.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          ratchet: "true"
          badge-label: baudelaire cov

      - name: upload coverage xml
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: cobertura.xml

