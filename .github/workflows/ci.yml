name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - name: probe
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?event=schedule&status=success&branch=$BRANCH&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SHA unchanged since last nightly, skipping coverage"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"
      - name: restore cargo registry
        id: registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: restore build cache
        id: build-cache
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test prerequisites
        run: |
          for tool in curl base64 git; do
            command -v "$tool" >/dev/null || { echo "$tool is required"; exit 1; }
          done

      - name: test
        id: test
        uses: cestef/actions/nextest@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          run: "true"
          args: --workspace --no-tests warn

      - name: clippy (slim)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: test (slim)
        uses: cestef/actions/nextest@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          run: "true"
          args: --workspace --no-default-features --no-tests warn

      - name: memory diagnostics
        uses: cestef/actions/mem-diagnostics@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: failure()

      - name: facts
        id: facts
        run: |
          set -euo pipefail
          {
            echo "typst=$(grep -m1 'typst = {' Cargo.toml | sed -n 's/.*version = "\([^"]*\)".*/\1/p')"
            echo "msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          } >> "$GITHUB_OUTPUT"

      - name: badge (tests)
        if: always()
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: tests
          value: ${{ steps.test.outputs.passed }}/${{ steps.test.outputs.total }} passing
          percent: ${{ steps.test.outputs.percent }}
          thresholds: "100:#3fb950,0:#e5534b"
          file: tests.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: badge (typst)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: typst
          value: ${{ steps.facts.outputs.typst }}
          color: "#a371f7"
          file: typst.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: badge (msrv)
        uses: cestef/actions/badge@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          label: rust
          value: ${{ steps.facts.outputs.msrv }}+
          color: "#8b949e"
          file: msrv.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: save cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: always() && steps.registry.outputs.hit != 'true'
        with:
          mode: save
      - name: save build cache
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        if: always() && steps.build-cache.outputs.hit != 'true'
        with:
          mode: save
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

  # There is Windows-aware code in the tree (`src/fs.rs`, `src/engine/hook.rs`)
  # and nothing that compiles it, so it can rot without anyone noticing. This
  # job is what notices.
  #
  # Compilation only, and no release artifact yet. Two reasons to stop here
  # rather than add a matrix row to `release.yml`: the e2e tests shell out to
  # `base64`, which Windows runners do not have, and the default feature set
  # reaches `aws-lc-sys` through `russh`, whose Windows build wants NASM. Both
  # flavors run so that the slim one, which drops `ssh` and therefore
  # `aws-lc-sys` entirely, reports separately from the full one; shipping a
  # Windows binary is a decision to make once this job has been green.
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b

      # The workflow-level RUSTFLAGS asks for mold, which is a Linux linker.
      # `-D warnings` is kept: the point of the job is that warnings here are
      # real. The `macos` rows in `release.yml` clear it the same way.
      - name: system linker
        shell: bash
        run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"

      - name: restore cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b

      - name: check
        run: cargo check --workspace --all-targets --locked

      - name: check (slim)
        run: cargo check --workspace --all-targets --locked --no-default-features

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # Read from Cargo.toml rather than written here, for the same reason the
      # badge reads it: `rust-version` is the claim, and a second copy of it is
      # a second thing to forget. `facts` in the `check` job parses it the same
      # way.
      #
      # Selected through `RUSTUP_TOOLCHAIN`, not `rustup override`: this repo
      # has a `rust-toolchain.toml` pinning `stable`, and the environment
      # variable is the one form that unambiguously outranks it.
      - name: msrv toolchain
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$msrv" ] || { echo "Cargo.toml has no rust-version"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"
      - name: restore cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b

      # `check`, not `clippy`: this job answers "does the declared minimum
      # actually compile", and clippy's lint set moves between releases, so
      # linting here would fail on style the MSRV toolchain happens to disagree
      # about rather than on anything a user would hit.
      #
      # Both flavors, because `--no-default-features` compiles a different set
      # of modules, and `--all-targets` because a contributor on the MSRV builds
      # the tests too.
      - name: check
        run: cargo check --workspace --all-targets --locked

      - name: check (slim)
        run: cargo check --workspace --all-targets --locked --no-default-features

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # Fetched as a release binary rather than built from source: this job
      # needs no toolchain, no registry cache and no `target/`, so it stays a
      # ~20s check instead of a second full compile.
      - name: cargo-deny
        env:
          DENY_VERSION: "0.20.2"
        run: |
          set -euo pipefail
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download"
          asset="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL "$url/$DENY_VERSION/$asset.tar.gz" | tar xz --strip-components=1 "$asset/cargo-deny"
          install -m755 cargo-deny "$HOME/.cargo/bin/cargo-deny"

      # Gating, advisories included. A newly published advisory can fail a PR
      # that did not cause it, which is the intended trade: baudelaire runs in
      # CI holding S3 keys, SSH keys and app passwords, so "you are shipping a
      # known vulnerability" should block rather than wait for someone to read a
      # report. The nightly schedule means drift surfaces even with no PRs open.
      #
      # The fix for a false alarm is an `ignore` entry in `deny.toml` carrying
      # why it does not apply, never a loosened check.
      # No `--all-features`: `deny.toml` already sets it, and passing both makes
      # cargo-deny warn about the duplicate.
      - name: cargo deny
        run: cargo deny check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: guard
    if: github.event_name != 'push' && needs.guard.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          components: llvm-tools-preview
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"
      - name: restore cargo registry
        id: registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b

      - name: coverage
        id: cov
        uses: cestef/actions/tarpaulin@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          args: --workspace --exclude-files benches/* --engine llvm
          out: Stdout Xml

      - name: coverage report
        uses: cestef/actions/coverage-report@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          file: cobertura.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          ratchet: "true"
          badge-label: coverage

      - name: upload coverage xml
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: cobertura.xml

