name: Docs

# The docs site is a real baudelaire site and the theme previews are real
# builds, so a typst error in either is a build failure that `just ci` does not
# cover. Running on pull requests too means it fails on the branch that caused
# it rather than on main afterwards; only the deploy step is push-only.
#
# One path list, aliased into both triggers. Actions has supported YAML anchors
# since 2025-09-18; it is merge keys (`<<:`) it still rejects, and an alias is
# not one.
on:
  push:
    branches: [main]
    paths: &paths
      - "docs/**"
      # The changelog is a page of the site, generated from this file.
      - "CHANGELOG.md"
      - "themes/**"
      - "src/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *paths
  # A release is what makes a version publishable, and it lands well after the
  # commit that named it: the run that push triggered has already skipped the new
  # tag as undownloadable. `release.yml` dispatches this workflow once the assets
  # are up, which is why there is no `on: release` here. There was, and it never
  # fired once: the release is created with `GITHUB_TOKEN`, and an event that
  # token raises does not start a workflow run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  CARGO_INCREMENTAL: 0

jobs:
  ship:
    name: build & deploy
    runs-on: ubuntu-latest
    steps:
      # Full history: every published version is built from its own tag, and a
      # shallow clone has none of them.
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"
      - name: restore cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: restore build cache
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

      - name: build baudelaire
        run: cargo build

      # The working tree's docs, compiled and link-checked by the working tree's
      # binary, writing nothing. Nothing deploys this: the site serves released
      # versions only. It runs so a typst error or a broken link in an
      # unreleased docs edit fails on the branch that wrote it rather than at
      # the next release.
      - name: check docs sources
        working-directory: docs
        run: ../target/debug/baudelaire check

      # What actually deploys: every published version, each built from its own
      # tag by its own released binary, newest at the root.
      - name: build published versions
        run: docs/versions.sh

      # After the docs build, never before: that site sets `prune`, which
      # deletes everything under its `dist` that its own build did not produce.
      - name: build theme previews
        run: themes/demo/build.sh
        env:
          BAUDELAIRE: ./target/debug/baudelaire

      # Push and manual runs only. A pull request builds the site to prove it
      # compiles and stops there: it has no access to the Cloudflare secrets,
      # and publishing a fork's docs over the live site is not a thing to make
      # possible in the first place.
      - name: deploy to cloudflare pages
        if: github.event_name != 'pull_request'
        uses: cestef/actions/wrangler@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          command: pages deploy public --project-name=baudelaire --branch=main
          working-directory: docs
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
