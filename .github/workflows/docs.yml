# First-party actions are pinned to a commit, not `@github`: the deploy step
# runs with this repo's Cloudflare API token, so a push to the actions repo
# would otherwise change what runs with that secret. Bump with:
#   git ls-remote https://github.com/cestef/actions github
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# A new push makes the in-flight run for the same ref obsolete, so stop paying
# for it. Release is deliberately excluded: cancelling mid-publish is worse than
# a redundant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  # Byte-identical to CI's, deliberately: cargo folds RUSTFLAGS into every
  # fingerprint, so a single differing flag means this job shares nothing
  # with the target cache CI populated and rebuilds the whole dep graph.
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  CARGO_INCREMENTAL: 0

jobs:
  # No gate job here. It re-ran the clippy and tests that CI runs on the very
  # same push, for ~305s of duplicated work. CI still verifies the commit in
  # parallel; a red commit shows up there, and the next push redeploys.
  ship:
    name: build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: cestef/actions/rust@aafe7ef9d13a19cfe46d7218648f256a868e5c1a
      - name: mold linker
        uses: cestef/actions/mold@aafe7ef9d13a19cfe46d7218648f256a868e5c1a
        with:
          rustflags: "false" # RUSTFLAGS already carries the mold link-arg
      - name: restore cargo registry
        uses: cestef/actions/cargo-cache@aafe7ef9d13a19cfe46d7218648f256a868e5c1a
      # Same key CI's `check` job writes, so this build starts warm.
      - name: restore build cache
        uses: cestef/actions/cargo-cache@aafe7ef9d13a19cfe46d7218648f256a868e5c1a
        with:
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

      - name: build baudelaire
        run: cargo build

      - name: build docs site
        working-directory: docs
        run: ../target/debug/baudelaire build

      # No `save` here on purpose: CI's `check` job saves the very same registry
      # key on every push, and a key can only be reserved once, so whichever
      # lost the race just logged `Cache save failed`. This job restores only.

      - name: deploy to cloudflare pages
        uses: cestef/actions/wrangler@aafe7ef9d13a19cfe46d7218648f256a868e5c1a
        with:
          command: pages deploy public --project-name=baudelaire --branch=main
          working-directory: docs
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
