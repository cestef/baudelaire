name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "themes/**"
      - "src/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  CARGO_INCREMENTAL: 0

jobs:
  ship:
    name: build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: rust toolchain
        uses: cestef/actions/rust@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: mold linker
        uses: cestef/actions/mold@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          rustflags: "false"
      - name: restore cargo registry
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
      - name: restore build cache
        uses: cestef/actions/cargo-cache@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target

      - name: build baudelaire
        run: cargo build

      - name: build docs site
        working-directory: docs
        run: ../target/debug/baudelaire build

      # After the docs build, never before: that site sets `prune`, which
      # deletes everything under its `dist` that its own build did not produce.
      - name: build theme previews
        run: themes/demo/build.sh
        env:
          BAUDELAIRE: ./target/debug/baudelaire

      - name: deploy to cloudflare pages
        uses: cestef/actions/wrangler@2b1d7ad829a284117b64c14ab49f0ba5cb73d59b
        with:
          command: pages deploy public --project-name=baudelaire --branch=main
          working-directory: docs
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
