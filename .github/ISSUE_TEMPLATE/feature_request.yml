name: Feature request
description: Something baudelaire should be able to do and cannot
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A few things are already decided and get closed on sight: an embedded
        scripting language, menus in config, typst's typed-HTML API, and lossy
        image optimization. The reasoning is in
        [CONTRIBUTING.md](https://github.com/cestef/baudelaire/blob/main/CONTRIBUTING.md#settled-and-not-worth-re-proposing).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What you were trying to build, and where baudelaire got in the way.
        Describe the situation rather than the feature: the best solution is
        often not the one either of us thought of first.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: >
        The workaround, if there is one: a hook, a template, a post-build
        script, another tool. If it works, say why it is not enough.
    validations:
      required: false

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: >
        The config block, flag, or Typst call you would want to write. A guess
        is fine; it makes the discussion concrete.
      render: text
    validations:
      required: false
