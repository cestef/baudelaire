# First-party actions are pinned to a commit, not `@main`: they run with this
# repo's R2 credentials and Cloudflare API token, so a push to the actions repo
# would otherwise change what runs with those secrets. Bump with:
#   git ls-remote https://codeberg.org/cstef/actions HEAD
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".forgejo/workflows/docs.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  # The docs site is built by this repo's own binary, and this workflow fires on
  # any `src/**` push, so without a gate a commit that fails CI still shipped a
  # site built from it.
  gate:
    runs-on: linux-any-large
    steps:
      - uses: actions/checkout@v4

      - uses: https://codeberg.org/cstef/actions/rust@2f67efe8a159031b9a95246225515f4361d90299
      - uses: https://codeberg.org/cstef/actions/mold@2f67efe8a159031b9a95246225515f4361d90299
        with:
          rustflags: "false"

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: https://codeberg.org/cstef/actions/nextest@2f67efe8a159031b9a95246225515f4361d90299
        with:
          run: "true"
          args: --workspace --no-tests warn

  ship:
    needs: gate
    runs-on: linux-any-large
    steps:
      - uses: actions/checkout@v4

      - uses: https://codeberg.org/cstef/actions/rust@2f67efe8a159031b9a95246225515f4361d90299
      - uses: https://codeberg.org/cstef/actions/mold@2f67efe8a159031b9a95246225515f4361d90299
        with:
          rustflags: "false" # RUSTFLAGS already carries the mold link-arg
      - uses: https://codeberg.org/cstef/actions/sccache@2f67efe8a159031b9a95246225515f4361d90299
        with:
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        with:
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}

      - name: build baudelaire
        run: cargo build

      - name: build docs site
        working-directory: docs
        run: ../target/debug/baudelaire build

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        if: always()
        with:
          mode: save
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}

      - uses: https://codeberg.org/cstef/actions/wrangler@2f67efe8a159031b9a95246225515f4361d90299
        with:
          command: pages deploy public --project-name=baudelaire --branch=main
          working-directory: docs
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
