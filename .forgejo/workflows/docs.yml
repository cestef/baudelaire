name: Docs

# The documentation site lives in `docs/` and is built by baudelaire itself —
# the site is its own dogfood. Build the binary, run it over `docs/`, deploy.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".forgejo/workflows/docs.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ship:
    runs-on: linux-any
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install

      # See ci.yml — small pruned cache that survives Codeberg eviction. Keyed
      # on Cargo.lock + rustc, so it runs after the toolchain install. Distinct
      # shared-key from CI because this is a release build (separate target).
      - name: cargo cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: docs

      - name: build baudelaire
        run: cargo build --release

      - name: build docs site
        working-directory: docs
        run: ../target/release/baudelaire build

      - uses: https://codeberg.org/cstef/bloom/deploy@main
        with:
          path: docs/public
          service: baudelaire
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-host-key: ${{ secrets.DEPLOY_HOST_KEY }}
          label: ${{ github.ref_name }}
