name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".forgejo/workflows/docs.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  ship:
    runs-on: linux-any-large
    steps:
      - uses: actions/checkout@v4

      - uses: https://codeberg.org/cstef/actions/rust@main
      - uses: https://codeberg.org/cstef/actions/mold@main
        with:
          rustflags: "false" # RUSTFLAGS already carries the mold link-arg
      - uses: https://codeberg.org/cstef/actions/sccache@main
        with:
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: build baudelaire
        run: cargo build

      - name: build docs site
        working-directory: docs
        run: ../target/debug/baudelaire build

      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://baudelaire.cstef.dev/
          server: codeberg.page
          token: ${{ forge.token }}
          source: docs/public/
