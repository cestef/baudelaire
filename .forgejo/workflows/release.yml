name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # sccache -> R2; see ci.yml. Keys on target+rustflags, so matrix rows share one bucket.
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: baudelaire-sccache
  SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  SCCACHE_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: linux-amd64-large
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            runner: linux-amd64-large
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-aarch64
            runner: linux-arm64-large
            target: aarch64-unknown-linux-gnu
          - name: linux-aarch64-musl
            runner: linux-arm64-large
            target: aarch64-unknown-linux-musl
            musl: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: rust toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      # musl targets link a from-source OpenSSL (`vendored-openssl`), which needs
      # a musl-targeting C compiler plus perl/make. `musl-gcc` builds the C code;
      # rustc's self-contained musl handles the final static link.
      - name: musl toolchain
        if: matrix.musl
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends musl-tools perl make
          elif command -v apk >/dev/null; then
            apk add --no-cache musl-dev gcc perl make
          fi

      - name: sccache
        uses: https://github.com/mozilla-actions/sccache-action@v0.0.10

      # Each matrix row runs on its native-arch runner, so no cross-linking is
      # needed. Two flavors per target: the default `full` binary and a `slim`
      # one (`--no-default-features`: system fonts, assets copied verbatim). Each
      # is tarred with a matching checksum; slim carries a `-slim` suffix.
      - name: build
        shell: bash
        env:
          # Compile the vendored OpenSSL C for the musl target (no-op for gnu,
          # where `EXTRA_FEATURES` is empty). Target-scoped so host build scripts
          # and proc-macros still use the default host compiler.
          EXTRA_FEATURES: ${{ matrix.musl && 'vendored-openssl' || '' }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          package() {  # $1 = asset suffix, rest = extra cargo flags
            local suffix="$1"; shift
            cargo build --release --target ${{ matrix.target }} \
              ${EXTRA_FEATURES:+--features "$EXTRA_FEATURES"} "$@"
            local out="baudelaire-${{ matrix.name }}${suffix}.tar.gz"
            tar -C "target/${{ matrix.target }}/release" -czf "$out" baudelaire
            sha256sum "$out" > "$out.sha256"
            ls -la "$out" "$out.sha256"
          }
          package ""
          package "-slim" --no-default-features

      - uses: actions/upload-artifact@v3
        with:
          name: baudelaire-${{ matrix.name }}
          path: |
            baudelaire-${{ matrix.name }}.tar.gz
            baudelaire-${{ matrix.name }}.tar.gz.sha256
            baudelaire-${{ matrix.name }}-slim.tar.gz
            baudelaire-${{ matrix.name }}-slim.tar.gz.sha256

  release:
    needs: build
    runs-on: linux-any
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v3
        with:
          path: dist

      - name: flatten artifacts
        run: |
          mkdir -p release
          find dist -mindepth 2 -type f -exec mv -t release {} +
          # Ship the installer alongside the tarballs, with its own checksum, so
          # a pinned `install.sh` can be fetched and verified from the release.
          cp install.sh release/
          ( cd release && sha256sum install.sh > install.sh.sha256 )
          ls -la release

      - name: release notes
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag || github.ref_name }}"
          bin_size() {
            local tarball="release/$1"
            [ -f "$tarball" ] || { echo "?"; return; }
            local bytes
            bytes=$(tar -tzvf "$tarball" 2>/dev/null \
              | awk '/[[:space:]]baudelaire$/ {print $3; exit}')
            [ -n "$bytes" ] || { echo "?"; return; }
            awk -v b="$bytes" 'BEGIN { printf "%.1f MB\n", b/1024/1024 }'
          }
          SIZE_X86=$(bin_size "baudelaire-linux-x86_64.tar.gz")
          SIZE_ARM=$(bin_size "baudelaire-linux-aarch64.tar.gz")
          SIZE_X86_SLIM=$(bin_size "baudelaire-linux-x86_64-slim.tar.gz")
          SIZE_ARM_SLIM=$(bin_size "baudelaire-linux-aarch64-slim.tar.gz")
          SIZE_X86_MUSL=$(bin_size "baudelaire-linux-x86_64-musl.tar.gz")
          SIZE_ARM_MUSL=$(bin_size "baudelaire-linux-aarch64-musl.tar.gz")
          SIZE_X86_MUSL_SLIM=$(bin_size "baudelaire-linux-x86_64-musl-slim.tar.gz")
          SIZE_ARM_MUSL_SLIM=$(bin_size "baudelaire-linux-aarch64-musl-slim.tar.gz")

          cat > release-notes.md <<EOF
          ## Install

          Prebuilt binary (Linux x86_64 / aarch64), checksum-verified. Fetch the
          script, skim it, then run it:

          \`\`\`bash
          curl -fsSL https://baudelaire.cstef.dev/install.sh -o install.sh
          less install.sh          # read before you run
          sh install.sh            # PREFIX= to change dir, VERSION=${VERSION} to pin
          \`\`\`

          Want the smaller binary? \`FLAVOR=slim sh install.sh\`.

          Prefer Cargo? \`cargo binstall baudelaire\` pulls the full tarballs.

          Or install by hand from the tarballs below:

          \`\`\`bash
          tar -xzf baudelaire-linux-x86_64.tar.gz
          install -m 0755 baudelaire ~/.local/bin/
          \`\`\`

          ## Builds

          Two flavors per target. **full** is the default: everything built in.
          **slim** drops the bundled fonts and the CSS/JS/image pipelines, so it
          renders with system fonts only and copies \`.css\`/\`.js\`/images verbatim
          (no minify, bundle, or optimize). Pick slim when your host has the fonts
          and you run your own asset tooling.

          The \`gnu\` builds link the host's glibc; the fully static \`musl\` builds
          run anywhere (Alpine, distroless, scratch containers).

          | Artifact | Size |
          |----------|------|
          | \`baudelaire-linux-x86_64\` | ${SIZE_X86} |
          | \`baudelaire-linux-x86_64-slim\` | ${SIZE_X86_SLIM} |
          | \`baudelaire-linux-x86_64-musl\` | ${SIZE_X86_MUSL} |
          | \`baudelaire-linux-x86_64-musl-slim\` | ${SIZE_X86_MUSL_SLIM} |
          | \`baudelaire-linux-aarch64\` | ${SIZE_ARM} |
          | \`baudelaire-linux-aarch64-slim\` | ${SIZE_ARM_SLIM} |
          | \`baudelaire-linux-aarch64-musl\` | ${SIZE_ARM_MUSL} |
          | \`baudelaire-linux-aarch64-musl-slim\` | ${SIZE_ARM_MUSL_SLIM} |

          Every artifact ships a matching \`.sha256\` (the installer too). Verify:

          \`\`\`bash
          sha256sum -c baudelaire-linux-x86_64.tar.gz.sha256
          \`\`\`
          EOF
          cat release-notes.md

      - uses: https://code.forgejo.org/actions/forgejo-release@v2.11.1
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-dir: release
          release-notes-file: release-notes.md
          override: true
