# First-party actions are pinned to a commit, not `@main`: they run with this
# repo's R2 credentials and Cloudflare API token, so a push to the actions repo
# would otherwise change what runs with those secrets. Bump with:
#   git ls-remote https://codeberg.org/cstef/actions HEAD
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    runs-on: linux-any-large
    steps:
      - uses: actions/checkout@v4

      - uses: https://codeberg.org/cstef/actions/rust@2f67efe8a159031b9a95246225515f4361d90299
      - uses: https://codeberg.org/cstef/actions/mold@2f67efe8a159031b9a95246225515f4361d90299
        with:
          rustflags: "false" # RUSTFLAGS already carries the mold link-arg
      - uses: https://codeberg.org/cstef/actions/sccache@2f67efe8a159031b9a95246225515f4361d90299
        with:
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
      # Restore the crate registry (sccache caches compiler output, not downloads).
      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        with:
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
      # Restore target/ (dep rlibs, build-script outputs, fingerprint DB; not sccache's).
      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        with:
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}

      # Cheapest check first: rustfmt compiles nothing, so it fails fastest.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # End-to-end tests shell out to these; a missing one looks like a product
      # bug rather than a missing tool.
      - name: test prerequisites
        run: |
          for tool in curl base64 git; do
            command -v "$tool" >/dev/null || { echo "$tool is required"; exit 1; }
          done

      - uses: https://codeberg.org/cstef/actions/nextest@2f67efe8a159031b9a95246225515f4361d90299
        with:
          run: "true"
          args: --workspace --no-tests warn

      # The `slim` flavour ships for every target but nothing else builds it, so
      # a feature-gated break stayed invisible until a tag was pushed.
      - name: clippy (slim)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - uses: https://codeberg.org/cstef/actions/nextest@2f67efe8a159031b9a95246225515f4361d90299
        with:
          run: "true"
          args: --workspace --no-default-features --no-tests warn

      - uses: https://codeberg.org/cstef/actions/mem-diagnostics@2f67efe8a159031b9a95246225515f4361d90299
        if: failure()

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      # Persist any newly downloaded crates (immutable key: skips if unchanged).
      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        if: always()
        with:
          mode: save
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
      # Persist target/ (immutable per Cargo.lock + rustc: skips if unchanged).
      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        if: always()
        with:
          mode: save
          prefix: target-cache
          toolchain-key: "true"
          base: "."
          paths: target
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}

  coverage:
    runs-on: linux-any-large
    steps:
      - uses: actions/checkout@v4

      # llvm-tools-preview: tarpaulin's LLVM engine reads profraw with llvm-profdata.
      - uses: https://codeberg.org/cstef/actions/rust@2f67efe8a159031b9a95246225515f4361d90299
        with:
          components: llvm-tools-preview
      - uses: https://codeberg.org/cstef/actions/mold@2f67efe8a159031b9a95246225515f4361d90299
        with:
          rustflags: "false" # RUSTFLAGS already carries the mold link-arg
      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        with:
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
      # Separate target/ cache: instrumented artifacts don't match the check job's.
      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        with:
          prefix: target-cache-cov
          toolchain-key: "true"
          base: "."
          paths: target
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}

      # Coverage recompiles with instrumentation, so it doesn't share the sccache
      # cache. The LLVM engine avoids ptrace/ASLR, which the runner's seccomp
      # profile blocks (the default ptrace engine fails with EPERM there).
      - id: cov
        uses: https://codeberg.org/cstef/actions/tarpaulin@2f67efe8a159031b9a95246225515f4361d90299
        with:
          args: --workspace --exclude-files benches/* --engine llvm
          out: Stdout Xml

      # Publish a badge (default branch), comment the delta on PRs, and ratchet:
      # a PR can't drop coverage below main's, minus a small tolerance.
      - uses: https://codeberg.org/cstef/actions/coverage-report@2f67efe8a159031b9a95246225515f4361d90299
        with:
          percent: ${{ steps.cov.outputs.percent }}
          bucket: baudelaire-badges
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_BADGE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_BADGE_SECRET_ACCESS_KEY }}
          public-url: https://pub-5363e10fff4a4996aefc53c255177c80.r2.dev
          token: ${{ forge.token }}
          server-url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          event-name: ${{ github.event_name }}
          ref-name: ${{ github.ref_name }}
          pr-number: ${{ github.event.pull_request.number }}
          ratchet: "true"
          badge-label: baudelaire cov

      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage
          path: cobertura.xml

      # Persist the instrumented target/ (immutable per Cargo.lock + rustc).
      - uses: https://codeberg.org/cstef/actions/cargo-cache@2f67efe8a159031b9a95246225515f4361d90299
        if: always()
        with:
          mode: save
          prefix: target-cache-cov
          toolchain-key: "true"
          base: "."
          paths: target
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
