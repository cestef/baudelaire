name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    runs-on: linux-any-large
    steps:
      - uses: actions/checkout@v4

      - uses: https://codeberg.org/cstef/actions/rust@main
      - uses: https://codeberg.org/cstef/actions/mold@main
        with:
          rustflags: "false" # RUSTFLAGS already carries the mold link-arg
      - uses: https://codeberg.org/cstef/actions/sccache@main
        with:
          bucket: baudelaire-sccache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Cheapest check first: rustfmt compiles nothing, so it fails fastest.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The serve/embed end-to-end tests shell out to `curl` and `base64`.
      - name: test prerequisites
        run: |
          command -v curl >/dev/null || { echo "curl is required"; exit 1; }
          command -v base64 >/dev/null || { echo "base64 is required"; exit 1; }

      - uses: https://codeberg.org/cstef/actions/nextest@main
        with:
          run: "true"
          args: --workspace --no-tests warn

      - name: memory diagnostics
        if: failure()
        run: grep -H . /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events 2>/dev/null || true

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
